<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up Saldo</title>
    <link rel="stylesheet" href="/css/topup.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Isi Saldo</h2>
        <input type="number" id="amountInput" class="amount-input" placeholder="Masukkan jumlah topup (Rp)" min="0">
        <div class="preset-buttons">
            <button onclick="setAmount(10000)">Rp 10.000</button>
            <button onclick="setAmount(20000)">Rp 20.000</button>
            <button onclick="setAmount(50000)">Rp 50.000</button>
            <button onclick="setAmount(100000)">Rp 100.000</button>
        </div>
        <div id="qrcode"></div>
        <div class="total" id="totalDisplay"></div>
        <button id="generateBtn" onclick="generateQR()">Generate QR Code</button>
    </div>

    <script>
        function setAmount(value) {
            document.getElementById('amountInput').value = value;
            updateTotal();
        }

        function updateTotal() {
            const amount = parseInt(document.getElementById('amountInput').value) || 0;
            document.getElementById('totalDisplay').textContent = `Total: Rp ${amount.toLocaleString('id-ID')}`;
        }

        function generateQR() {
            const amount = document.getElementById('amountInput').value;
            if (!amount || amount <= 0) {
                alert('Silakan masukkan jumlah topup yang valid');
                return;
            }
            // Example QR content: you could replace with actual payment QR data
            const qrData = `TOPUP|${amount}|${new Date().getTime()}`;
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = ''; // clear previous
            QRCode.toCanvas(qrData, { width: 200 }, function (error, canvas) {
                if (error) console.error(error);
                else qrcodeDiv.appendChild(canvas);
            });
            updateTotal();
        }

        // Initialize
        updateTotal();
    </script>
</body>
</html>
